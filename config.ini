[server]
host = 127.0.0.1
port = 8081
socket_timeout_seconds = 10
max_connections = 20

[protocol]
max_message_bytes = 16384
max_response_bytes = 1048576

[tls]
cert_file = runtime/server-cert.pem
key_file = runtime/server-key.pem
ca_file = runtime/server-cert.pem
key_password_env = TLS_KEY_PASSWORD

[logging]
server_log_file = server/server_log.log
client_log_file = client/client_log.log

[database]
host = 127.0.0.1
port = 3306
database = secure_messenger
user = secure_messenger_app
password_env = MYSQL_PASSWORD
connect_timeout_seconds = 5
